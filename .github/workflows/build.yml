name: build

# main 푸시: 맥·윈도우 앱을 빌드해 본다(릴리스는 만들지 않는다).
# v* 태그 푸시: 빌드가 모두 성공하면 GitHub 릴리스를 만들고 아래 파일을 올린다.
#   CatTimer2-macOS.zip, CatTimer2-Windows-Portable.exe 와 각각의 .sha256
# 파일명은 버전 없이 고정하고 태그가 버전을 구분한다. 앱 안 업데이트(src-tauri/src/update.rs)가
# 이 이름으로 에셋을 찾으므로 이름을 바꾸면 업데이트가 깨진다.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# 같은 브랜치의 이전 빌드는 취소하되, 태그(릴리스) 빌드는 중간에 취소하지 않는다.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # 이 앱은 Apple Silicon(arm64)만 지원한다. 러너가 Intel이면 잘못된 파일이 나가므로 여기서 멈춘다.
      - name: 러너가 arm64인지 확인
        run: test "$(uname -m)" = "arm64"
      - run: npm ci
      - run: npm test
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: 앱 빌드
        run: npx tauri build --bundles app
      # 서명 없이 만든 번들이 깨지지 않도록 ad-hoc 서명하고, 앱 버전이 package.json과 같은지 확인한다.
      - name: 번들 검증과 ad-hoc 서명
        run: |
          APP=src-tauri/target/release/bundle/macos/CatTimer2.app
          VER="$(python3 -c "import json; print(json.load(open('package.json'))['version'])")"
          BUILT="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          echo "package.json=$VER 앱=$BUILT"
          test "$VER" = "$BUILT"
          codesign --force --deep -s - "$APP"
          codesign --verify --deep --strict "$APP"
      - name: zip과 sha256 만들기
        run: |
          ditto -c -k --keepParent src-tauri/target/release/bundle/macos/CatTimer2.app CatTimer2-macOS.zip
          shasum -a 256 CatTimer2-macOS.zip | awk '{printf "%s", $1}' > CatTimer2-macOS.zip.sha256
          ls -l CatTimer2-macOS.zip*
          cat CatTimer2-macOS.zip.sha256; echo
      - uses: actions/upload-artifact@v7
        with:
          name: CatTimer2-mac
          path: CatTimer2-macOS.zip*
          if-no-files-found: error

  win:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml
      # 설치 파일 없이 실행 파일만 만든다(프론트엔드가 exe에 포함된 포터블 단일 exe).
      - name: 앱 빌드
        run: npx tauri build --no-bundle
      - name: 고정 파일명으로 복사하고 sha256 만들기
        shell: pwsh
        run: |
          Copy-Item src-tauri/target/release/cat-timer2.exe CatTimer2-Windows-Portable.exe
          $hash = (Get-FileHash CatTimer2-Windows-Portable.exe -Algorithm SHA256).Hash.ToLower()
          # 줄바꿈·BOM 없이 해시만 쓴다.
          [System.IO.File]::WriteAllText("$PWD/CatTimer2-Windows-Portable.exe.sha256", $hash)
          Get-ChildItem CatTimer2-Windows-Portable.exe* | Format-Table Name, Length
          Write-Output $hash
      - uses: actions/upload-artifact@v7
        with:
          name: CatTimer2-win
          path: CatTimer2-Windows-Portable.exe*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 순서 주의: checkout은 기본적으로 추적되지 않는 파일(out/)을 지우므로 아티팩트 다운로드보다 먼저 실행한다.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: out
      # 파일 이름, .sha256 일치, 태그 = package.json = Cargo.toml 버전을 확인한다. 하나라도 어긋나면 릴리스를 만들지 않는다.
      - name: 릴리스 파일 검사
        run: bash scripts/check-release.sh out "$GITHUB_REF_NAME"
      - name: 릴리스 만들기
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
